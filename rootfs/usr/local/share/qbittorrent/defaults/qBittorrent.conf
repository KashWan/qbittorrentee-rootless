; ============================================================================
;  qBittorrent Enhanced Edition · 首次启动默认配置模板
;
;  @@XXX@@ 占位符由 /etc/cont-init.d/10-config 在首次启动时替换。
;  该文件只在 /config/config/qBittorrent.conf 不存在时写入，之后完全交给你
;  在 WebUI 里改。qBittorrent 本身会重写此文件，注释会在重写后丢失。
;
;  安全说明：模板刻意不写入任何 WebUI 密码。
;  首次启动时 qBittorrent 会生成一次性随机密码并打印到容器日志：
;      podman logs qbittorrentee | grep -i "temporary password"
; ============================================================================

[Application]
FileLogger\Enabled=false
FileLogger\Path=@@BASE_DIR@@/data/logs

[BitTorrent]
Session\DefaultSavePath=@@DOWNLOADS_DIR@@
Session\TempPath=@@DOWNLOADS_DIR@@/incomplete
Session\TempPathEnabled=true
Session\Port=@@BT_PORT@@
Session\StartPaused=false
Session\QueueingSystemEnabled=true
Session\GlobalMaxRatio=-1
Session\GlobalMaxSeedingMinutes=-1
Session\DefaultTorrentContentLayout=Subfolder

[LegalNotice]
Accepted=true

[Network]
PortForwardingEnabled=false
Proxy\Type=0

[Preferences]
WebUI\Address=*
WebUI\Port=@@WEBUI_PORT@@
WebUI\UseUPnP=false
WebUI\HTTPS\Enabled=false
WebUI\CSRFProtection=true
WebUI\ClickjackingProtection=true
WebUI\HostHeaderValidation=false
WebUI\ServerDomains=*
WebUI\LocalHostAuth=false
WebUI\MaxAuthenticationFailCount=5
WebUI\BanDuration=3600
WebUI\AlternativeUIEnabled=false
General\Locale=@@LOCALE@@
General\UseRandomPort=false
MailNotification\enabled=false
